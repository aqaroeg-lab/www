<div class="p-5 pb-32 max-w-md mx-auto text-right font-sans antialiased text-white dir-rtl relative" dir="rtl">
    
    <!-- نظام التنبيهات العائم (Toast Container) -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[200] w-11/12 max-w-sm flex flex-col gap-2 pointer-events-none"></div>

    <!-- الهيدر العلوي والأرصدة -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-xl font-black text-white tracking-wide">إعلاناتي 🏠</h2>
            <p class="text-[11px] text-zinc-400 font-bold mt-0.5">إدارة وتطوير تمييز ظهور عقاراتك</p>
        </div>
        
        <div class="flex gap-2">
            <!-- رصيد إحياء الأحياء -->
            <div class="bg-zinc-900/90 border border-zinc-800 px-3.5 py-2 rounded-2xl flex items-center gap-2 shadow-lg backdrop-blur-md">
                <i class="fa-solid fa-rotate text-emerald-400 text-xs"></i>
                <div class="flex flex-col text-right">
                    <span class="text-[9px] text-zinc-400 font-bold leading-none">الأحياء</span>
                    <span id="ref-count" class="text-xs font-black text-white leading-tight">0</span>
                </div>
            </div>
            
            <!-- رصيد التمييز -->
            <div class="bg-zinc-900/90 border border-zinc-800 px-3.5 py-2 rounded-2xl flex items-center gap-2 shadow-lg backdrop-blur-md">
                <i class="fa-solid fa-star text-amber-400 text-xs"></i>
                <div class="flex flex-col text-right">
                    <span class="text-[9px] text-zinc-400 font-bold leading-none">التمييز</span>
                    <span id="feat-count" class="text-xs font-black text-white leading-tight">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- قائمة الإعلانات -->
    <div id="my-ads-list" class="space-y-4">
        <div class="text-center py-16 text-zinc-500 text-xs font-bold bg-zinc-900/40 rounded-3xl border border-zinc-800/50 backdrop-blur-sm">
            <i class="fa-solid fa-circle-notch animate-spin text-red-500 text-base mb-2 block"></i>
            جاري تحميل إعلاناتك...
        </div>
    </div>
</div>

<!-- نافذة تأكيد الحذف المخصصة -->
<div id="delete-dialog" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-[150] transition-all">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm p-6 rounded-3xl text-center space-y-4 shadow-2xl relative overflow-hidden transform scale-95 transition-all">
        <div class="w-12 h-12 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center justify-center mx-auto text-red-500 text-lg shadow-lg">
            <i class="fa-solid fa-trash-can"></i>
        </div>
        <div>
            <h3 class="text-sm font-black text-white mb-1">حذف الإعلان</h3>
            <p class="text-xs text-zinc-400 font-bold">هل أنت متأكد من رغبتك في حذف هذا الإعلان نهائياً؟</p>
        </div>
        <div class="grid grid-cols-2 gap-2.5 pt-2">
            <button id="confirm-delete-btn" class="py-3 rounded-2xl bg-red-600 hover:bg-red-500 text-white font-black text-xs transition-all active:scale-95 shadow-lg shadow-red-600/25">
                نعم، احذف
            </button>
            <button onclick="window.closeDeleteDialog()" class="py-3 rounded-2xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold text-xs transition-all border border-zinc-700/50">
                إلغاء
            </button>
        </div>
    </div>
</div>

<!-- نافذة تعديل الإعلان المخصصة -->
<div id="edit-dialog" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-[150] transition-all">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm p-6 rounded-3xl text-right space-y-4 shadow-2xl relative overflow-hidden transform scale-95 transition-all">
        <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
            <h3 class="text-xs font-black text-white flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-red-500"></i>
                تعديل بيانات الإعلان
            </h3>
            <button onclick="window.closeEditDialog()" class="text-zinc-500 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>
        <div class="space-y-3">
            <div>
                <label class="block text-[10px] font-bold text-zinc-400 mb-1">عنوان الإعلان</label>
                <input type="text" id="edit-ad-title" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs font-bold text-white outline-none focus:border-red-500/50">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-zinc-400 mb-1">السعر (ج.م)</label>
                <input type="number" id="edit-ad-price" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs font-bold text-white outline-none focus:border-red-500/50">
            </div>
        </div>
        <div class="pt-2">
            <button id="save-edit-btn" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-black text-xs transition-all active:scale-95 shadow-lg shadow-red-600/25">
                حفظ التعديلات
            </button>
        </div>
    </div>
</div>

<script>
(function() {
    window.targetAdToDelete = null;
    window.targetAdToEdit = null;

    // نظام التنبيهات المخصص (Toast)
    window.showToast = function(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        let bgStyle = 'bg-zinc-900/95 border-zinc-800 text-zinc-200';
        let icon = '<i class="fa-solid fa-circle-info text-blue-400"></i>';

        if (type === 'success') {
            bgStyle = 'bg-zinc-900/95 border-emerald-500/40 text-emerald-400';
            icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
        } else if (type === 'error') {
            bgStyle = 'bg-zinc-900/95 border-red-500/40 text-red-400';
            icon = '<i class="fa-solid fa-circle-xmark text-red-500"></i>';
        } else if (type === 'warning') {
            bgStyle = 'bg-zinc-900/95 border-amber-500/40 text-amber-400';
            icon = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>';
        }

        toast.className = `pointer-events-auto p-3.5 rounded-2xl border ${bgStyle} shadow-2xl backdrop-blur-xl flex items-center gap-3 text-xs font-black transition-all duration-300 opacity-0 transform -translate-y-2`;
        toast.innerHTML = `${icon}<span class="flex-1 leading-snug">${message}</span>`;

        container.appendChild(toast);

        requestAnimationFrame(() => {
            toast.classList.remove('opacity-0', '-translate-y-2');
        });

        setTimeout(() => {
            toast.classList.add('opacity-0', '-translate-y-2');
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    };

    // حماية الأكواد من ثغرات XSS
    function escapeHTML(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    if (typeof firebase !== 'undefined') {
        firebase.auth().onAuthStateChanged(async user => {
            if (!user) return;

            const list = document.getElementById('my-ads-list');
            const userRef = db.collection("users").doc(user.uid);

            // مراقبة بيانات المستخدم والمزامنة الذكية لرصيد الباقة
            userRef.onSnapshot(async doc => {
                const data = doc.data() || {};
                
                // في حال وجود باقة مفعّلة ولكن رصيد الأحياء أو التمييز غير محدد (مزامنة تلقائية)
                if (data.activePlanId && (data.remainingDistricts === undefined || data.remainingBoosts === undefined)) {
                    try {
                        const planDoc = await db.collection("packages").doc(data.activePlanId).get();
                        if (planDoc.exists) {
                            const pData = planDoc.data();
                            await userRef.update({
                                remainingDistricts: pData.districts || 0,
                                remainingBoosts: pData.boosts || 0
                            });
                            return;
                        }
                    } catch (e) { console.error("خطأ مزامنة الباقة:", e); }
                }

                const refCountEl = document.getElementById('ref-count');
                const featCountEl = document.getElementById('feat-count');
                if (refCountEl) refCountEl.innerText = Number(data.remainingDistricts || 0).toLocaleString();
                if (featCountEl) featCountEl.innerText = Number(data.remainingBoosts || 0).toLocaleString();
            });

            // جلب قائمة إعلانات المستخدم
            db.collection("ads").where("userId", "==", user.uid).onSnapshot(snap => {
                if (!list) return;

                if (snap.empty) {
                    list.innerHTML = `
                        <div class="text-center py-16 text-zinc-500 text-xs font-bold bg-zinc-900/40 rounded-3xl border border-zinc-800/50 backdrop-blur-sm">
                            <i class="fa-solid fa-building-circle-exclamation text-zinc-600 text-2xl mb-2 block"></i>
                            لا توجد إعلانات عقارية مسجلة لحسابك حالياً
                        </div>`;
                    return;
                }

                list.innerHTML = "";
                snap.forEach(doc => {
                    const ad = doc.data();
                    
                    // التحقق من صلاحية التمييز (3 أيام)
                    let isFeatured = false;
                    if (ad.featuredUntil) {
                        const untilDate = ad.featuredUntil.toDate ? ad.featuredUntil.toDate() : new Date(ad.featuredUntil);
                        if (untilDate > new Date()) {
                            isFeatured = true;
                        }
                    } else if (ad.isFeatured === true) {
                        isFeatured = true; // توافق مع الإعلانات القديمة
                    }

                    const safeTitle = escapeHTML(ad.title || 'بدون عنوان');
                    const price = Number(ad.price || 0).toLocaleString();
                    const imageUrl = ad.image || (ad.images && ad.images[0]) || 'https://via.placeholder.com/150';

                    list.innerHTML += `
                        <div class="bg-zinc-900/90 border ${isFeatured ? 'border-amber-500/40 shadow-amber-500/5' : 'border-zinc-800/80'} p-4 rounded-3xl transition-all shadow-xl backdrop-blur-md hover:border-zinc-700">
                            <div class="flex gap-3.5">
                                <img src="${imageUrl}" class="w-20 h-20 rounded-2xl object-cover bg-zinc-800 border border-zinc-700/50 shrink-0">
                                <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                                    <div>
                                        <h3 class="text-xs font-black text-white truncate mb-1">${safeTitle}</h3>
                                        <p class="text-red-500 font-black text-xs">${price} <span class="text-[9px] font-bold">ج.م</span></p>
                                    </div>
                                    ${isFeatured ? 
                                        '<span class="text-[9px] font-black text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2.5 py-0.5 rounded-lg w-max flex items-center gap-1 shadow-sm"><i class="fa-solid fa-star text-[8px]"></i> مميز (لمدة 3 أيام)</span>' 
                                        : '<span class="text-[9px] font-bold text-zinc-500">إعلان عادي</span>'}
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-4 gap-2 mt-4 pt-3 border-t border-zinc-800/60">
                                <button onclick="window.performAction('refresh', '${doc.id}')" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 p-2.5 rounded-xl text-[10px] font-black active:scale-95 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-rotate"></i> إحياء
                                </button>
                                <button onclick="window.performAction('feature', '${doc.id}')" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 p-2.5 rounded-xl text-[10px] font-black active:scale-95 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-star"></i> تمييز
                                </button>
                                <button onclick="window.openEditDialog('${doc.id}', '${safeTitle.replace(/'/g, "\\'")}', ${ad.price || 0})" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/50 p-2.5 rounded-xl text-[10px] font-black active:scale-95 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-pen"></i> تعديل
                                </button>
                                <button onclick="window.openDeleteDialog('${doc.id}')" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 p-2.5 rounded-xl text-[10px] font-black active:scale-95 transition-all flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-trash-can"></i> حذف
                                </button>
                            </div>
                        </div>`;
                });
            });
        });
    }

    // تنفيذ عمليات الإحياء والتمييز بآلية Firestore Transaction الآمنة
    window.performAction = async (type, id) => {
        const user = firebase.auth().currentUser;
        if (!user) {
            window.showToast("يرجى تسجيل الدخول أولاً!", "warning");
            return;
        }

        const userRef = db.collection("users").doc(user.uid);
        const adRef = db.collection("ads").doc(id);

        try {
            await db.runTransaction(async (transaction) => {
                const userDoc = await transaction.get(userRef);
                if (!userDoc.exists) throw new Error("بيانات المستخدم غير موجودة");

                const userData = userDoc.data();

                if (type === 'refresh') {
                    const currentDistricts = Number(userData.remainingDistricts || 0);
                    if (currentDistricts <= 0) throw new Error("NO_DISTRICTS");

                    transaction.update(adRef, { createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    transaction.update(userRef, { remainingDistricts: currentDistricts - 1 });

                } else if (type === 'feature') {
                    const currentBoosts = Number(userData.remainingBoosts || 0);
                    if (currentBoosts <= 0) throw new Error("NO_BOOSTS");

                    // حساب تاريخ انتهاء التمييز (3 أيام من الآن)
                    const featureEndDate = new Date(Date.now() + (3 * 24 * 60 * 60 * 1000));

                    transaction.update(adRef, { 
                        isFeatured: true,
                        featuredUntil: firebase.firestore.Timestamp.fromDate(featureEndDate)
                    });
                    transaction.update(userRef, { remainingBoosts: currentBoosts - 1 });
                }
            });

            if (type === 'refresh') window.showToast("تم إحياء الإعلان وتحديث تاريخه بنجاح! 🚀", "success");
            if (type === 'feature') window.showToast("تم تمييز الإعلان بنجاح لمدة 3 أيام! ⭐", "success");

        } catch (error) {
            console.error("خطأ العملية:", error);
            if (error.message === "NO_DISTRICTS") {
                window.showToast("رصيد الأحياء انتهى! اشترك في باقة للحصول على المزيد.", "warning");
            } else if (error.message === "NO_BOOSTS") {
                window.showToast("رصيد التمييز انتهى! اشترك في باقة للحصول على المزيد.", "warning");
            } else {
                window.showToast("حدث خطأ أثناء تنفيذ العملية", "error");
            }
        }
    };

    // التحكم في مودال الحذف الاحترافي
    window.openDeleteDialog = function(id) {
        window.targetAdToDelete = id;
        const dialog = document.getElementById('delete-dialog');
        if (dialog) {
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
        }
    };

    window.closeDeleteDialog = function() {
        window.targetAdToDelete = null;
        const dialog = document.getElementById('delete-dialog');
        if (dialog) {
            dialog.classList.add('hidden');
            dialog.classList.remove('flex');
        }
    };

    const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
    if (confirmDeleteBtn) {
        confirmDeleteBtn.onclick = async function() {
            if (!window.targetAdToDelete) return;
            try {
                await db.collection("ads").doc(window.targetAdToDelete).delete();
                window.showToast("تم حذف الإعلان نهائياً", "success");
                window.closeDeleteDialog();
            } catch (err) {
                console.error("خطأ الحذف:", err);
                window.showToast("فشل حذف الإعلان!", "error");
            }
        };
    }

    // التحكم في مودال التعديل الاحترافي
    window.openEditDialog = function(id, currentTitle, currentPrice) {
        window.targetAdToEdit = id;
        document.getElementById('edit-ad-title').value = currentTitle || '';
        document.getElementById('edit-ad-price').value = currentPrice || 0;

        const dialog = document.getElementById('edit-dialog');
        if (dialog) {
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
        }
    };

    window.closeEditDialog = function() {
        window.targetAdToEdit = null;
        const dialog = document.getElementById('edit-dialog');
        if (dialog) {
            dialog.classList.add('hidden');
            dialog.classList.remove('flex');
        }
    };

    const saveEditBtn = document.getElementById('save-edit-btn');
    if (saveEditBtn) {
        saveEditBtn.onclick = async function() {
            if (!window.targetAdToEdit) return;

            const newTitle = document.getElementById('edit-ad-title').value.trim();
            const newPrice = Number(document.getElementById('edit-ad-price').value);

            if (!newTitle) {
                window.showToast("يرجى إدخال عنوان للإعلان", "warning");
                return;
            }

            this.disabled = true;
            this.innerText = "جاري الحفظ...";

            try {
                await db.collection("ads").doc(window.targetAdToEdit).update({
                    title: newTitle,
                    price: newPrice,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                window.showToast("تم تحديث بيانات الإعلان بنجاح!", "success");
                window.closeEditDialog();
            } catch (err) {
                console.error("خطأ التعديل:", err);
                window.showToast("حدث خطأ أثناء تعديل الإعلان", "error");
            } finally {
                this.disabled = false;
                this.innerText = "حفظ التعديلات";
            }
        };
    }
})();
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العقارات - أكارو</title>
    <!-- استدعاء Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(39, 39, 42, 0.5); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(82, 82, 91, 0.8); border-radius: 4px; }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 antialiased selection:bg-red-500 selection:text-white">

<!-- حاوية التنبيهات السريعة (Toast System) -->
<div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[110] flex flex-col gap-2 w-full max-w-xs px-4 pointer-events-none"></div>

<!-- المحتوى الرئيسي -->
<div id="main-content" class="w-full max-w-7xl mx-auto py-4 md:py-10 px-3 md:px-8 pb-28 min-h-screen">

    <!-- شريط العنوان وتحديث البيانات السريع -->
    <div class="flex justify-between items-center mb-4 px-1">
        <h1 class="text-xs font-bold text-zinc-400">تصفح أحدث العقارات المتاحة</h1>
        <button onclick="window.refreshAppData()" id="refresh-btn" class="bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-xl text-xs text-zinc-300 hover:text-white flex items-center gap-1.5 transition">
            <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            تحديث
        </button>
    </div>

    <!-- البانر العلوي -->
    <div class="relative w-full mb-6 md:mb-10">
        <div id="banners-slider" class="flex overflow-x-auto no-scrollbar snap-x snap-mandatory h-44 md:h-96 border-y md:border border-zinc-800/80 bg-zinc-900 relative w-full rounded-2xl md:rounded-3xl overflow-hidden shadow-2xl">
            <div class="min-w-full w-full h-full shrink-0 bg-zinc-800/50 animate-pulse flex items-center justify-center text-zinc-600 text-xs md:text-base font-bold">جاري تحميل البانرات...</div>
        </div>
        
        <!-- نقاط المؤشر -->
        <div id="slider-dots" class="absolute bottom-3 md:bottom-5 left-1/2 -translate-x-1/2 z-10 flex items-center gap-1.5 md:gap-2 bg-black/40 backdrop-blur-md px-3 md:px-5 py-1.5 md:py-2 rounded-full border border-white/10 pointer-events-auto"></div>
    </div>

    <!-- شريط البحث السريع والتصفية -->
    <div class="space-y-3 mb-8 md:mb-12 max-w-3xl md:max-w-4xl mx-auto px-1">
        <div class="flex gap-2.5 md:gap-4 items-center">
            <div class="flex-1 bg-zinc-900/90 backdrop-blur-md p-3.5 md:p-5 rounded-2xl md:rounded-3xl border border-zinc-800/80 flex items-center gap-3 md:gap-4 shadow-xl focus-within:border-zinc-600 transition-all">
                <svg class="w-4 h-4 md:w-6 md:h-6 shrink-0 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="main-search" oninput="window.applyFilters()" placeholder="ابحث عن عقار، منطقة، أو مشروع..." class="bg-transparent border-none outline-none text-xs md:text-base text-white w-full font-bold placeholder:text-zinc-600">
            </div>
            <button onclick="window.openFullOverlay()" class="w-12 h-12 md:w-16 md:h-16 bg-zinc-800 border border-zinc-700 rounded-2xl md:rounded-3xl shadow-lg hover:scale-105 active:scale-95 transition-all text-white flex items-center justify-center shrink-0">
                <svg class="w-5 h-5 md:w-7 md:h-7 text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 11-14 0m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 11-14 0m0 4v2m0-6V4"></path></svg>
            </button>
        </div>

        <!-- أزرار اختيار المحافظة والمدينة -->
        <div class="grid grid-cols-2 gap-2.5 md:gap-4">
            <button type="button" onclick="window.openLocationModal('gov')" id="gov-btn" class="w-full bg-zinc-900/90 px-3.5 md:px-5 py-3 md:py-4 rounded-2xl md:rounded-3xl border border-zinc-800/80 flex items-center justify-between text-[11px] md:text-sm text-zinc-300 font-bold hover:border-zinc-700 transition">
                <div class="flex items-center gap-2 md:gap-3 truncate">
                    <svg class="w-3.5 h-3.5 md:w-5 md:h-5 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                    <span id="gov-label" class="truncate">كل المحافظات</span>
                </div>
                <svg class="w-3 h-3 md:w-4 md:h-4 text-zinc-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>

            <button type="button" onclick="window.openLocationModal('city')" id="city-btn" class="w-full bg-zinc-900/90 px-3.5 md:px-5 py-3 md:py-4 rounded-2xl md:rounded-3xl border border-zinc-800/80 flex items-center justify-between text-[11px] md:text-sm text-zinc-300 font-bold hover:border-zinc-700 transition">
                <div class="flex items-center gap-2 md:gap-3 truncate">
                    <svg class="w-3.5 h-3.5 md:w-5 md:h-5 text-zinc-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    <span id="city-label" class="truncate">كل المدن</span>
                </div>
                <svg class="w-3 h-3 md:w-4 md:h-4 text-zinc-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
        </div>
    </div>

    <!-- قسم العقارات المميزة -->
    <section id="featured-section" class="mb-10 md:mb-14 hidden">
        <div class="flex items-center justify-between mb-4 md:mb-6 px-2">
            <h3 class="font-black text-sm md:text-xl text-white flex items-center gap-2.5 md:gap-3">
                <span class="w-7 h-7 md:w-10 md:h-10 rounded-xl md:rounded-2xl bg-yellow-500/10 flex items-center justify-center border border-yellow-500/20">
                    <svg class="text-yellow-500 w-3.5 h-3.5 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                </span>
                <span>عقارات مميزة حصرياً</span>
            </h3>
        </div>
        <div id="featured-ads-container" class="flex md:grid overflow-x-auto md:overflow-visible no-scrollbar md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 px-2 pb-2 snap-x md:snap-none"></div>
    </section>

    <!-- الأقسام الديناميكية للعقارات -->
    <div id="dynamic-sections" class="space-y-10 md:space-y-14">
        <div class="text-center py-10 text-zinc-500 text-xs md:text-base font-bold">جاري تحميل العقارات...</div>
    </div>
</div>

<!-- نافذة التصفية المتقدمة -->
<div id="category-overlay" class="fixed inset-y-0 left-0 md:left-auto md:right-0 z-[150] bg-[#09090b] w-full md:w-[480px] translate-x-full transition-transform duration-300 ease-in-out overflow-y-auto p-5 md:p-8 border-r border-zinc-800 shadow-2xl">
    <div class="flex justify-between items-center mb-6 border-b border-zinc-900 pb-4">
        <h2 class="font-black text-sm md:text-lg text-white flex items-center gap-2">
            <svg class="w-4 h-4 md:w-6 md:h-6 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
            فلترة وتصفية العقارات
        </h2>
        <button onclick="window.closeOverlay()" class="w-9 h-9 md:w-11 md:h-11 bg-zinc-900 border border-zinc-800 rounded-full flex items-center justify-center hover:bg-zinc-800 transition text-zinc-400 hover:text-white">
            <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    
    <div class="space-y-4 mb-6">
        <div>
            <label class="block text-[11px] md:text-sm text-zinc-400 font-bold mb-1.5 mr-1">القسم الرئيسي</label>
            <select id="filter-outer" onchange="window.syncInnerFilters()" class="w-full bg-zinc-900 p-3.5 md:p-4 rounded-2xl text-xs md:text-base border border-zinc-800 text-white font-bold outline-none focus:border-zinc-500 transition"></select>
        </div>
        <div>
            <label class="block text-[11px] md:text-sm text-zinc-400 font-bold mb-1.5 mr-1">نوع العقار الفرعي</label>
            <select id="filter-inner" onchange="window.applyFilters()" class="w-full bg-zinc-900 p-3.5 md:p-4 rounded-2xl text-xs md:text-base border border-zinc-800 text-white font-bold outline-none focus:border-zinc-500 transition"></select>
        </div>
    </div>
    
    <div id="overlay-results" class="grid grid-cols-1 md:grid-cols-2 gap-3.5 pb-10"></div>
</div>

<!-- نافذة اختيار المحافظات والمدن -->
<div id="location-modal" class="fixed inset-0 z-[120] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
    <div id="location-modal-card" class="bg-zinc-900 border border-zinc-800/90 w-full max-w-sm md:max-w-md rounded-3xl p-4 md:p-6 shadow-2xl transform scale-95 transition-all duration-300 flex flex-col max-h-[65vh]">
        
        <div class="flex items-center justify-between pb-3 mb-2 border-b border-zinc-800/80 shrink-0">
            <h3 id="modal-title" class="text-xs md:text-base font-black text-white flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                اختر المحافظة
            </h3>
            <button onclick="window.closeLocationModal()" class="w-7 h-7 md:w-8 md:h-8 bg-zinc-800 rounded-full flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-700 transition">
                <svg class="w-3.5 h-3.5 md:w-4 md:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="mb-2.5 shrink-0">
            <input type="text" id="modal-search" oninput="window.filterModalList()" placeholder="بحث سريع..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-[11px] md:text-sm text-white outline-none focus:border-zinc-600 transition placeholder:text-zinc-600 font-bold">
        </div>

        <div id="modal-list" class="overflow-y-auto space-y-1 pr-1 custom-scrollbar flex-1"></div>
    </div>
</div>

<script>
(function() {
    const egyptLocations = {
        "القاهرة": ["التجمع الخامس", "القاهرة الجديدة", "مدينة نصر", "المعادي", "الشروق", "مدينتي", "العاصمة الإدارية", "مصر الجديدة", "الزمالك", "الرحاب", "المقطم", "عين شمس", "شبرا", "حلوان", "وسط البلد"],
        "الجيزة": ["6 أكتوبر", "الشيخ زايد", "حدائق الأهرام", "حدائق أكتوبر", "الدقي", "المهندسين", "الهرم", "فيصل", "العجوزة", "إمبابة", "البدرشين"],
        "الإسكندرية": ["سموحة", "المنتزه", "المعمورة", "العجمي", "سان ستيفانو", "ميامي", "سيدي بشر", "محرم بك", "لوران", "برج العرب"],
        "البحر الأحمر": ["الغردقة", "الجونة", "سهل حشيش", "مرسى علم", "سفاجا", "رأس غارب"],
        "جنوب سيناء": ["شرم الشيخ", "دهب", "نويبع", "راس سدر", "طابا"],
        "مطروح": ["الساحل الشمالي", "مرسى مطروح", "العلمين الجديدة", "سيوة", "رأس الحكمة"],
        "الشرقية": ["الزقازيق", "العاشر من رمضان", "بلبيس", "منيا القمح", "فاقوس"],
        "الدقهلية": ["المنصورة", "المنصورة الجديدة", "طلخا", "ميت غمر", "شربين"],
        "القليوبية": ["بنها", "شبرا الخيمة", "العبور", "الخانكة", "طوخ"],
        "السويس": ["السويس", "العين السخنة", "حي الأربعين"],
        "بورسعيد": ["بورسعيد", "بورفؤاد"],
        "الإسماعيلية": ["الإسماعيلية", "القنطرة", "فايد"],
        "الغربية": ["طنطا", "المحلة الكبرى", "زفتى"],
        "المنوفية": ["شبين الكوم", "مدينة السادات", "أشمون"],
        "الب البحيرة": ["دمنهور", "كفر الدوار", "رشيد", "وادي النطرون"],
        "كفر الشيخ": ["كفر الشيخ", "دسوق", "بلطيم"],
        "دمياط": ["دمياط", "دمياط الجديدة", "رأس البر"],
        "الفيوم": ["الفيوم", "الفيوم الجديدة", "طامية"],
        "بني سويف": ["بني سويف", "بني سويف الجديدة"],
        "المنيا": ["المنيا", "المنيا الجديدة", "ملوي"],
        "أسيوط": ["أسيوط", "أسيوط الجديدة", "ديروط"],
        "سوهاج": ["سوهاج", "سوهاج الجديدة", "أخميم"],
        "قنا": ["قنا", "قنا الجديدة", "نجع حمادي"],
        "الأقصر": ["الأقصر", "إسنا", "أرمنت"],
        "أسوان": ["أسوان", "أسوان الجديدة", "كوم أمبو"]
    };

    const database = window.db || (typeof firebase !== 'undefined' ? firebase.firestore() : null);

    let allAds = [];
    let categoriesData = {};
    let activeModalType = 'gov';
    let currentSelectedGov = '';
    let currentSelectedCity = '';
    let slideInterval = null;

    window.showToast = (msg, type = 'info') => {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = `p-3 rounded-xl bg-zinc-900 border border-zinc-700/80 text-white text-[11px] md:text-xs font-bold shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-[-10px] opacity-0 pointer-events-auto`;
        toast.innerHTML = `
            <span class="w-2 h-2 rounded-full ${type === 'error' ? 'bg-red-500' : 'bg-emerald-500'} shrink-0"></span>
            <span class="flex-1">${msg}</span>
        `;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.remove('translate-y-[-10px]', 'opacity-0'); }, 10);
        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-[-10px]');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    };

    async function initApp() {
        if (!database) {
            loadDefaultData();
            return;
        }

        try {
            const cachedAds = localStorage.getItem('cached_ads');
            const cachedCats = localStorage.getItem('cached_categories');
            
            if (cachedAds && cachedCats) {
                allAds = JSON.parse(cachedAds);
                categoriesData = JSON.parse(cachedCats);
                window.updateOuterSelect();
                renderUI();
            }

            await fetchFreshDataFromFirebase();
        } catch (e) {
            console.error("خطأ في التهيئة:", e);
            loadDefaultData();
        }
    }

    async function fetchFreshDataFromFirebase() {
        try {
            const catDoc = await database.collection('settings').doc('categories').get();
            if (catDoc.exists) {
                categoriesData = catDoc.data() || {};
                localStorage.setItem('cached_categories', JSON.stringify(categoriesData));
                window.updateOuterSelect();
            }

            const bannersSnap = await database.collection('banners').get();
            renderBanners(bannersSnap.docs);

            const adsSnap = await database.collection('ads').get();
            const now = new Date();
            allAds = adsSnap.docs
                .map(doc => ({ id: doc.id, ...doc.data() }))
                .filter(ad => {
                    if (!ad.expireAt) return true;
                    const expireDate = ad.expireAt.toDate ? ad.expireAt.toDate() : new Date(ad.expireAt);
                    return expireDate > now;
                });

            localStorage.setItem('cached_ads', JSON.stringify(allAds));
            renderUI();
        } catch (e) {
            console.error("فشل جلب البيانات المحدثة:", e);
        }
    }

    window.refreshAppData = async () => {
        const btnIcon = document.getElementById('refresh-icon');
        if(btnIcon) btnIcon.classList.add('animate-spin');
        window.showToast('جاري تحديث البيانات...', 'info');
        
        await fetchFreshDataFromFirebase();
        
        if(btnIcon) btnIcon.classList.remove('animate-spin');
        window.showToast('تم تحديث البيانات بنجاح', 'success');
    };

    function loadDefaultData() {
        categoriesData = {
            "شقق": { name: "شقق للبيع", subCategories: ["شقق مفروشة", "شقق فارغة", "دوبلكس"] },
            "فيلات": { name: "فيلات وقصور", subCategories: ["فيلا مستقلة", "تاون هاوس", "توين هاوس"] },
            "تجاري": { name: "عقارات تجارية", subCategories: ["محلات", "مكاتب", "مخازن"] }
        };
        window.updateOuterSelect();
        allAds = [
            { id: 1, title: "شقة رائعة بالتجمع الخامس", price: 1500000, location: "التجمع الخامس", governorate: "القاهرة", city: "التجمع الخامس", mainType: "شقق", subType: "شقق فارغة", isFeatured: true, propertyType: "residential", specs: { "الغرف": 3, "الحمامات": 2, "المساحة الإجمالية": 150 }, image: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=500&q=80", phone: "01000000000" }
        ];
        renderBanners([]);
        renderUI();
    }

    function renderBanners(docs) {
        const slider = document.getElementById('banners-slider');
        const dotsContainer = document.getElementById('slider-dots');
        if (!slider) return;
        
        if(!docs || docs.length === 0) {
            slider.innerHTML = `<div class="min-w-full w-full h-full flex items-center justify-center text-zinc-600 text-xs md:text-sm font-bold">لا توجد بانرات متاحة حالياً</div>`;
            if(dotsContainer) dotsContainer.innerHTML = '';
            return;
        }

        const totalSlides = docs.length;

        slider.innerHTML = docs.map((doc, index) => `
            <div id="slide-${index}" class="min-w-full w-full h-full shrink-0 snap-center relative slide-item">
                <img src="${doc.data().image}" class="w-full h-full object-cover">
            </div>
        `).join('');
        
        if(dotsContainer) {
            dotsContainer.innerHTML = docs.map((_, index) => `
                <button type="button" onclick="window.goToSlide(${index})" class="dot-btn h-2 md:h-2.5 rounded-full transition-all duration-300 ${index === 0 ? 'w-5 md:w-6 bg-red-500' : 'w-2 md:w-2.5 bg-white/50 hover:bg-white'}"></button>
            `).join('');
        }

        let currentIndex = 0;

        window.goToSlide = (index) => {
            currentIndex = index;
            const targetSlide = document.getElementById(`slide-${index}`);
            if (targetSlide) {
                const scrollLeftPos = targetSlide.offsetLeft - slider.offsetLeft;
                slider.scrollTo({
                    left: scrollLeftPos,
                    behavior: 'smooth'
                });
            }
            updateDotsActiveState();
        };

        function updateDotsActiveState() {
            if(!dotsContainer) return;
            const dots = dotsContainer.querySelectorAll('.dot-btn');
            dots.forEach((dot, idx) => {
                if(idx === currentIndex) {
                    dot.className = "dot-btn h-2 md:h-2.5 rounded-full w-5 md:w-6 bg-red-500 transition-all duration-300";
                } else {
                    dot.className = "dot-btn h-2 md:h-2.5 rounded-full w-2 md:w-2.5 bg-white/50 hover:bg-white transition-all duration-300";
                }
            });
        }

        let scrollTimeout;
        slider.onscroll = () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const slideWidth = slider.clientWidth || slider.offsetWidth;
                if(slideWidth > 0) {
                    const scrollLeft = Math.abs(slider.scrollLeft);
                    const scrollIndex = Math.round(scrollLeft / slideWidth);
                    if(scrollIndex !== currentIndex && scrollIndex >= 0 && scrollIndex < totalSlides) {
                        currentIndex = scrollIndex;
                        updateDotsActiveState();
                    }
                }
            }, 50);
        };

        if (totalSlides > 1) {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                currentIndex++;
                if (currentIndex >= totalSlides) currentIndex = 0;
                window.goToSlide(currentIndex);
            }, 4000);
        }
    }

    window.openFullOverlay = (category = '') => {
        const overlay = document.getElementById('category-overlay');
        const outer = document.getElementById('filter-outer');
        if(overlay) overlay.classList.remove('translate-x-full');
        if(category && outer) {
            outer.value = category;
            window.syncInnerFilters();
            window.applyFilters();
        }
    };

    window.closeOverlay = () => {
        const overlay = document.getElementById('category-overlay');
        if(overlay) overlay.classList.add('translate-x-full');
    };

    window.updateOuterSelect = () => {
        const outer = document.getElementById('filter-outer');
        if(!outer) return;
        outer.innerHTML = '<option value="">كل الأقسام</option>';
        Object.keys(categoriesData).forEach(key => {
            if(key === 'secret_key') return;
            const catObj = categoriesData[key];
            const catName = typeof catObj === 'object' ? (catObj.name || key) : key;
            outer.innerHTML += `<option value="${key}">${catName}</option>`;
        });
        window.syncInnerFilters();
    };

    window.syncInnerFilters = () => {
        const outerVal = document.getElementById('filter-outer')?.value;
        const inner = document.getElementById('filter-inner');
        if(!inner) return;
        
        inner.innerHTML = '<option value="">الكل</option>';
        if(outerVal && categoriesData[outerVal]) {
            const subDetails = categoriesData[outerVal].subDetails;
            const subCategories = categoriesData[outerVal].subCategories;
            
            if (subDetails && typeof subDetails === 'object') {
                Object.keys(subDetails).forEach(subKey => {
                    const subObj = subDetails[subKey];
                    const subName = (typeof subObj === 'object' && subObj.name) ? subObj.name : subKey;
                    inner.innerHTML += `<option value="${subName}">${subName}</option>`;
                });
            } else if (Array.isArray(subCategories)) {
                subCategories.forEach(sub => {
                    inner.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
        }
        window.applyFilters();
    };

    window.openLocationModal = (type) => {
        activeModalType = type;
        const modal = document.getElementById('location-modal');
        const modalCard = document.getElementById('location-modal-card');
        const modalTitle = document.getElementById('modal-title');
        const searchInput = document.getElementById('modal-search');
        
        if (type === 'gov') {
            modalTitle.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> اختر المحافظة`;
        } else {
            if (!currentSelectedGov) {
                showToast('اختر المحافظة أولاً', 'error');
                return;
            }
            modalTitle.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> اختر المدينة (${currentSelectedGov})`;
        }

        if(searchInput) searchInput.value = '';
        buildModalItems('');

        if(modal && modalCard) {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }
    };

    window.closeLocationModal = () => {
        const modal = document.getElementById('location-modal');
        const modalCard = document.getElementById('location-modal-card');
        if(modal && modalCard) {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
        }
    };

    window.filterModalList = () => {
        const query = (document.getElementById('modal-search')?.value || '').toLowerCase();
        buildModalItems(query);
    };

    function buildModalItems(query) {
        const listContainer = document.getElementById('modal-list');
        if (!listContainer) return;
        listContainer.innerHTML = '';

        let items = [];
        let selectedVal = '';

        if (activeModalType === 'gov') {
            items = ['كل المحافظات', ...Object.keys(egyptLocations).sort()];
            selectedVal = currentSelectedGov || 'كل المحافظات';
        } else {
            items = ['كل المدن'];
            if (currentSelectedGov && egyptLocations[currentSelectedGov]) {
                items.push(...egyptLocations[currentSelectedGov]);
            }
            selectedVal = currentSelectedCity || 'كل المدن';
        }

        const filtered = items.filter(item => String(item).toLowerCase().includes(query));

        if (filtered.length === 0) {
            listContainer.innerHTML = `<div class="text-center py-6 text-zinc-600 text-[11px] font-bold">لا توجد نتائج</div>`;
            return;
        }

        filtered.forEach(item => {
            const isSelected = (item === selectedVal) || (item === 'كل المحافظات' && !currentSelectedGov) || (item === 'كل المدن' && !currentSelectedCity);
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `w-full text-right px-3 py-2 rounded-xl text-[11px] md:text-xs font-bold transition flex items-center justify-between ${
                isSelected 
                ? 'bg-red-500/10 text-red-400 border border-red-500/30' 
                : 'text-zinc-300 hover:bg-zinc-800/60 hover:text-white'
            }`;
            
            btn.innerHTML = `
                <span>${item}</span>${isSelected ? '<svg class="w-3.5 h-3.5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>' : ''}
            `;

            btn.onclick = () => selectLocationItem(item);
            listContainer.appendChild(btn);
        });
    }

    function selectLocationItem(val) {
        if (activeModalType === 'gov') {
            if (val === 'كل المحافظات') {
                currentSelectedGov = '';
                currentSelectedCity = '';
                document.getElementById('gov-label').innerText = 'كل المحافظات';
                document.getElementById('city-label').innerText = 'كل المدن';
            } else {
                currentSelectedGov = val;
                currentSelectedCity = '';
                document.getElementById('gov-label').innerText = val;
                document.getElementById('city-label').innerText = 'كل المدن';
            }
        } else {
            if (val === 'كل المدن') {
                currentSelectedCity = '';
                document.getElementById('city-label').innerText = 'كل المدن';
            } else {
                currentSelectedCity = val;
                document.getElementById('city-label').innerText = val;
            }
        }

        window.closeLocationModal();
        window.applyFilters();
    }

    window.applyFilters = () => {
        renderUI();
        
        const query = (document.getElementById('main-search')?.value || '').toLowerCase();
        const outerVal = document.getElementById('filter-outer')?.value;
        const innerVal = document.getElementById('filter-inner')?.value;
        const overlayResults = document.getElementById('overlay-results');
        
        if(overlayResults) {
            const filteredAds = allAds.filter(a => {
                const matchesSearch = !query || String(a.title || '').toLowerCase().includes(query) || String(a.location || '').toLowerCase().includes(query);
                const adGov = String(a.governorate || a.location || '');
                const adCity = String(a.city || a.location || '');
                const matchesGov = !currentSelectedGov || adGov.includes(currentSelectedGov);
                const matchesCity = !currentSelectedCity || adCity.includes(currentSelectedCity);
                const matchesOuter = !outerVal || a.mainType === outerVal;
                const matchesInner = !innerVal || a.subType === innerVal;
                
                return matchesSearch && matchesGov && matchesCity && matchesOuter && matchesInner;
            });
            
            if(filteredAds.length > 0) {
                overlayResults.innerHTML = filteredAds.map(a => createCard(a)).join('');
            } else {
                overlayResults.innerHTML = `<div class="text-center py-10 text-zinc-500 text-xs font-bold">لا توجد نتائج مطابقة</div>`;
            }
        }
    };

    function renderUI() {
        const currentScrollY = window.scrollY;

        const query = String(document.getElementById('main-search')?.value || '').toLowerCase();

        const featCont = document.getElementById('featured-ads-container');
        const featSec = document.getElementById('featured-section');
        
        const featuredAds = allAds.filter(a => {
            if (!a.isFeatured) return false;
            const matchesSearch = !query || String(a.title || '').toLowerCase().includes(query) || String(a.location || '').toLowerCase().includes(query);
            const adGov = String(a.governorate || a.location || '');
            const adCity = String(a.city || a.location || '');
            const matchesGov = !currentSelectedGov || adGov.includes(currentSelectedGov);
            const matchesCity = !currentSelectedCity || adCity.includes(currentSelectedCity);

            return matchesSearch && matchesGov && matchesCity;
        });
        
        if(featuredAds.length > 0 && featSec && featCont) {
            featSec.classList.remove('hidden');
            featCont.innerHTML = featuredAds.map(a => createCard(a, true)).join('');
        } else if (featSec) {
            featSec.classList.add('hidden');
        }

        const container = document.getElementById('dynamic-sections');
        if (!container) return;

        container.innerHTML = "";
        
        Object.keys(categoriesData).forEach(mainKey => {
            if(mainKey === 'secret_key') return;

            const ads = allAds.filter(a => {
                const matchesMain = (a.mainType === mainKey);
                const matchesSearch = !query || String(a.title || '').toLowerCase().includes(query) || String(a.location || '').toLowerCase().includes(query);
                const adGov = String(a.governorate || a.location || '');
                const adCity = String(a.city || a.location || '');
                const matchesGov = !currentSelectedGov || adGov.includes(currentSelectedGov);
                const matchesCity = !currentSelectedCity || adCity.includes(currentSelectedCity);

                return matchesMain && !a.isFeatured && matchesSearch && matchesGov && matchesCity;
            });

            if(ads.length > 0) {
                const catObj = categoriesData[mainKey] || {};
                const catName = typeof catObj === 'object' ? (catObj.name || mainKey) : mainKey;
                container.innerHTML += `
                    <section>
                        <div class="flex justify-between items-center mb-3 px-2">
                            <h3 class="font-bold text-sm md:text-base text-white flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-red-500"></span>
                                <span>${catName}</span>
                            </h3>
                            <button onclick="window.openFullOverlay('${mainKey}')" class="text-zinc-400 text-[11px] md:text-xs font-bold hover:underline">عرض الكل</button>
                        </div>
                        <div class="flex md:grid overflow-x-auto md:overflow-visible no-scrollbar md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 px-2 pb-2 snap-x md:snap-none">${ads.map(a => createCard(a)).join('')}</div>
                    </section>`;
            }
        });

        if (container.innerHTML === "") {
            container.innerHTML = `<div class="text-center py-12 text-zinc-500 text-xs md:text-sm font-bold px-4">لا توجد عقارات مطابقة لبحثك حالياً</div>`;
        }

        window.scrollTo(0, currentScrollY);
    }

    // دالة إنشاء الكروت متوافقة مع البيانات الديناميكية (شقق، أراضي، مولات، فلل)
    function createCard(ad, isFeatured = false) {
        const fallbackImg = 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=500&q=80';
        
        const specs = ad.specs || {};
        const pType = ad.propertyType || '';
        
        // استخراج البيانات حسب نوع العقار بشكل مرن
        const area = specs['المساحة الإجمالية'] || specs['المساحة'] || specs['مساحة العقار'] || ad.area || '0';
        
        let specItem1 = `<div class="flex flex-col items-center gap-1 p-1 bg-zinc-800/30 rounded-lg">
            <span class="text-zinc-500">المساحة</span>
            <span>${area} م²</span>
        </div>`;

        let specItem2 = ``;
        let specItem3 = ``;

        if (pType === 'residential' || pType === 'villa') {
            const rooms = specs['الغرف'] || specs['عدد الغرف'] || ad.rooms || '0';
            const baths = specs['الحمامات'] || specs['عدد الحمامات'] || ad.baths || '0';
            
            specItem2 = `<div class="flex flex-col items-center gap-1 p-1 bg-zinc-800/30 rounded-lg">
                <span class="text-zinc-500">الغرف</span>
                <span>${rooms} غرف</span>
            </div>`;
            specItem3 = `<div class="flex flex-col items-center gap-1 p-1 bg-zinc-800/30 rounded-lg">
                <span class="text-zinc-500">الحمامات</span>
                <span>${baths} حمام</span>
            </div>`;
        } else if (pType === 'land') {
            const meterPrice = specs['سعر المتر'] || '-';
            const buildingRatio = specs['نسبة البناء'] || '-';
            
            specItem2 = `<div class="flex flex-col items-center gap-1 p-1 bg-zinc-800/30 rounded-lg">
                <span class="text-zinc-500">سعر المتر</span>
                <span>${meterPrice} ج.م</span>
            </div>`;
            specItem3 = `<div class="flex flex-col items-center gap-1 p-1 bg-zinc-800/30 rounded-lg">
                <span class="text-zinc-500">نسبة البناء</span>
                <span>${buildingRatio}%</span>
            </div>`;
        } else if (pType === 'mall') {
            const finishing = specs['التشطيب'] || 'غير محدد';
            specItem2 = `<div class="flex flex-col items-center gap-1 p-1 bg-zinc-800/30 rounded-lg col-span-2">
                <span class="text-zinc-500">التشطيب</span>
                <span>${finishing}</span>
            </div>`;
        } else {
            // خانات افتراضية احتياطية إذا لم يتوفر النوع
            const rooms = specs['الغرف'] || specs['عدد الغرف'] || ad.rooms || '-';
            const baths = specs['الحمامات'] || specs['عدد الحمامات'] || ad.baths || '-';
            
            specItem2 = `<div class="flex flex-col items-center gap-1 p-1 bg-zinc-800/30 rounded-lg">
                <span class="text-zinc-500">الغرف</span>
                <span>${rooms}</span>
            </div>`;
            specItem3 = `<div class="flex flex-col items-center gap-1 p-1 bg-zinc-800/30 rounded-lg">
                <span class="text-zinc-500">الحمامات</span>
                <span>${baths}</span>
            </div>`;
        }
        
        const phone = String(ad.phone || ad.phoneNumber || '');
        const whatsapp = String(ad.whatsapp || phone || '');
        const images = ad.allImages || (ad.image ? [ad.image] : [fallbackImg]);
        const mainImg = images[0] || fallbackImg;

        return `
            <div class="min-w-[280px] max-w-[280px] md:min-w-0 md:max-w-none w-full shrink-0 bg-zinc-900/90 rounded-2xl md:rounded-3xl p-3 md:p-4 border ${isFeatured ? 'border-yellow-500/80 shadow-lg shadow-yellow-500/10' : 'border-zinc-800/80'} flex flex-col justify-between transition-all hover:border-zinc-700 hover:shadow-2xl snap-start">
                
                <div onclick="location.href='details.html?id=${ad.id}'" class="cursor-pointer">
                    <div class="relative w-full h-40 md:h-52 rounded-xl md:rounded-2xl overflow-hidden mb-3 bg-zinc-800">
                        <img src="${mainImg}" class="w-full h-full object-cover hover:scale-105 transition duration-500" loading="lazy">
                        ${isFeatured ? '<span class="absolute top-2 right-2 bg-yellow-500 text-black text-[9px] md:text-xs font-black px-2 py-0.5 rounded-md shadow">مميز</span>' : ''}
                        <span class="absolute bottom-2 right-2 bg-black/70 backdrop-blur-md text-white text-[10px] md:text-xs font-bold px-2 py-0.5 rounded-md md:rounded-xl flex items-center gap-1">
                            <svg class="w-3 h-3 text-red-500 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                            ${ad.location || ad.city || ad.governorate || 'غير محدد'}
                        </span>
                    </div>

                    <h4 class="text-xs md:text-sm font-bold truncate text-white mb-1">${ad.title || 'بدون عنوان'}</h4>
                    <p class="text-red-500 font-black text-sm md:text-base mb-2.5">${typeof ad.price === 'number' ? ad.price.toLocaleString() : ad.price} <span class="text-[10px] md:text-xs font-normal text-zinc-400">${typeof ad.price === 'number' ? 'ج.م' : ''}</span></p>

                    <div class="grid grid-cols-3 gap-1 mb-3 text-[10px] md:text-xs text-zinc-300 font-bold border-t border-zinc-800/80 pt-2 text-center">
                        ${specItem1}
                        ${specItem2}
                        ${specItem3}
                    </div>
                </div>
                
                <div class="flex gap-2 mt-auto">
                    <a href="tel:${phone}" onclick="event.stopPropagation()" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white py-2 md:py-2.5 rounded-lg md:rounded-xl text-[11px] md:text-xs font-bold flex items-center justify-center gap-1.5 transition">
                        <svg class="w-3 h-3 md:w-3.5 md:h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                        اتصال
                    </a>
                    <a href="https://wa.me/${whatsapp}" target="_blank" onclick="event.stopPropagation()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 md:py-2.5 rounded-lg md:rounded-xl text-[11px] md:text-xs font-bold flex items-center justify-center gap-1.5 transition">
                        <svg class="w-3.5 h-3.5 md:w-4 md:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"></path></svg>
                        واتساب
                    </a>
                </div>
            </div>`;
    }

    initApp();
})();
</script>
</body>
</html>

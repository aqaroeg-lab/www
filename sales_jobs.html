<div class="p-6 bg-gradient-to-b from-[#18181c] to-[#111113] rounded-b-[35px] border-b border-white/5 relative shadow-xl">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-black text-white flex items-center gap-2">
                <span>💼</span> إدارة لوحة الوظائف
            </h1>
            <p class="text-[10px] text-gray-400 mt-0.5">أعلن عن وظائف سيلز وتابع طلبات التوظيف الواردة لشركتك</p>
        </div>
        
        <button onclick="openAddJobModal()" class="px-4 py-2 bg-gradient-to-r from-rose-600 to-orange-500 hover:from-rose-500 hover:to-orange-400 rounded-xl text-xs font-bold text-white shadow-lg shadow-rose-500/20 transition-all flex items-center gap-1.5 active:scale-95">
            <i class="fa-solid fa-plus"></i> أعلن عن وظيفة
        </button>
    </div>

    <div class="flex gap-2 mt-5 bg-black/40 p-1 rounded-xl border border-white/5">
        <button onclick="switchJobTab('explore')" id="tab-explore" class="flex-1 py-2 text-center text-xs font-bold rounded-lg transition-all bg-rose-600 text-white">
            🔍 كل الوظائف المتاحة
        </button>
        <button onclick="switchJobTab('applications')" id="tab-applications" class="flex-1 py-2 text-center text-xs font-bold rounded-lg transition-all text-gray-400 hover:text-white relative">
            📨 طلبات التوظيف الواردة
            <span id="app-badge" class="hidden absolute -top-1 -left-1 bg-red-500 text-white text-[8px] px-1.5 py-0.5 rounded-full font-black animate-pulse">0</span>
        </button>
    </div>
</div>

<div class="p-6 pb-24 space-y-4">

    <div id="view-explore-jobs" class="space-y-3">
        <div id="jobs-skeleton" class="text-center py-10 text-gray-500 text-xs font-bold">
            <i class="fa-solid fa-circle-notch animate-spin text-rose-500 text-lg block mb-2"></i> جاري جلب الوظائف الحالية...
        </div>
        <div id="jobs-list" class="space-y-3"></div>
    </div>

    <div id="view-my-applications" class="hidden space-y-3">
        <div id="apps-list" class="space-y-3"></div>
    </div>
</div>

<div id="add-job-modal" class="fixed inset-0 bg-black/95 z-[999] hidden p-6 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-[#18181c] w-full max-w-sm p-6 rounded-3xl space-y-4 border border-white/5 max-h-[85vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b border-white/5 pb-2">
            <h3 class="font-black text-white text-base">➕ إضافة وظيفة سيلز جديدة</h3>
            <button onclick="closeAddJobModal()" class="text-gray-500 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="space-y-3 text-right">
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">المسمى الوظيفي</label>
                <input type="text" id="job-title" placeholder="مثال: مسؤول مبيعات عقارية خبرة" class="w-full bg-black p-3.5 rounded-xl outline-none text-white text-xs border border-white/5 focus:border-rose-500 transition-all">
            </div>

            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">المنطقة / المحافظة</label>
                <input type="text" id="job-location" placeholder="مثال: التجمع الخامس، القاهرة" class="w-full bg-black p-3.5 rounded-xl outline-none text-white text-xs border border-white/5 focus:border-rose-500 transition-all">
            </div>

            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">رقم هاتف للتواصل (واتساب)</label>
                <input type="tel" id="job-phone" placeholder="مثال: 01xxxxxxxxx" class="w-full bg-black p-3.5 rounded-xl outline-none text-white text-xs border border-white/5 focus:border-rose-500 transition-all text-left font-mono">
            </div>

            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">نوع العائد والراتب</label>
                <select id="job-salary-type" class="w-full bg-black p-3.5 rounded-xl outline-none text-white text-xs border border-white/5 focus:border-rose-500 transition-all">
                    <option value="عمولة فقط">💰 عمولة مجزية فقط</option>
                    <option value="راتب + عمولة">💵 راتب أساسي + عمولة</option>
                    <option value="راتب ثابت">💳 راتب ثابت شهرياً</option>
                </select>
            </div>

            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">تفاصيل الدفع والنسبة</label>
                <input type="text" id="job-salary-value" placeholder="مثال: 4000 ج + 1.5% عمولة على المبيعات" class="w-full bg-black p-3.5 rounded-xl outline-none text-white text-xs border border-white/5 focus:border-rose-500 transition-all">
            </div>

            <div>
                <label class="text-[10px] uppercase font-bold text-gray-400 block mb-1">تفاصيل وشروط الوظيفة</label>
                <textarea id="job-desc" rows="3" placeholder="اكتب شروط الوظيفة، والخبرات المطلوبة بالكامل..." class="w-full bg-black p-3.5 rounded-xl outline-none text-white text-xs border border-white/5 focus:border-rose-500 transition-all"></textarea>
            </div>
        </div>

        <div class="flex gap-2 pt-2">
            <button onclick="publishJob()" class="flex-1 py-3 bg-gradient-to-r from-rose-600 to-orange-500 rounded-xl font-bold text-white text-xs shadow-lg shadow-rose-500/10">نشر الوظيفة فوراً</button>
            <button onclick="closeAddJobModal()" class="flex-1 py-3 bg-white/5 rounded-xl font-bold text-gray-400 text-xs">إلغاء</button>
        </div>
    </div>
</div>

<script>
    function openAddJobModal() { document.getElementById('add-job-modal').classList.remove('hidden'); }
    function closeAddJobModal() { document.getElementById('add-job-modal').classList.add('hidden'); }

    function switchJobTab(tab) {
        const expView = document.getElementById('view-explore-jobs');
        const appView = document.getElementById('view-my-applications');
        const expBtn = document.getElementById('tab-explore');
        const appBtn = document.getElementById('tab-applications');

        if (tab === 'explore') {
            expView.classList.remove('hidden');
            appView.classList.add('hidden');
            expBtn.className = "flex-1 py-2 text-center text-xs font-bold rounded-lg transition-all bg-rose-600 text-white";
            appBtn.className = "flex-1 py-2 text-center text-xs font-bold rounded-lg transition-all text-gray-400 hover:text-white relative";
        } else {
            expView.classList.add('hidden');
            appView.classList.remove('hidden');
            appBtn.className = "flex-1 py-2 text-center text-xs font-bold rounded-lg transition-all bg-rose-600 text-white relative";
            expBtn.className = "flex-1 py-2 text-center text-xs font-bold rounded-lg transition-all text-gray-400 hover:text-white";
        }
    }

    (function initSalesJobsSystem() {
        const db = firebase.firestore();
        const user = firebase.auth().currentUser;

        if (!user) {
            window.location.href = "welcome.html";
            return;
        }

        listenToLiveJobs(user, db);
        listenToIncomingApplications(user.uid, db);

        // 1️⃣ دالة جلب كل الوظائف المتاحة في السوق لايف
        function listenToLiveJobs(currentUser, firestoreDb) {
            firestoreDb.collection('sales_jobs').where('status', '==', 'active').onSnapshot(snap => {
                const jobsList = document.getElementById('jobs-list');
                document.getElementById('jobs-skeleton').classList.add('hidden');
                jobsList.innerHTML = '';

                if (snap.empty) {
                    jobsList.innerHTML = `<div class="text-center py-12 text-gray-500 text-xs font-bold">💼 لا توجد وظائف معلنة حالياً.</div>`;
                    return;
                }

                const sortedDocs = snap.docs.sort((a, b) => {
                    const timeA = a.data().createdAt ? a.data().createdAt.toMillis() : 0;
                    const timeB = b.data().createdAt ? b.data().createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                sortedDocs.forEach(doc => {
                    const job = doc.data();
                    const jobId = doc.id;
                    const isMyOwnJob = (job.companyId === currentUser.uid);
                    // تنظيف رقم الهاتف للواتساب
                    const cleanPhone = job.phone ? job.phone.replace(/[^0-9]/g, '') : '';
                    
                    const card = document.createElement('div');
                    card.className = "bg-[#18181c] p-4 rounded-2xl border border-white/5 space-y-3 relative overflow-hidden shadow-lg transition-all hover:border-white/10";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-sm font-bold text-white">${job.title}</h3>
                                <p class="text-[10px] text-gray-400 mt-0.5"><i class="fa-solid fa-building text-gray-600 ml-1"></i> ${job.companyName}</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-lg text-[9px] font-black bg-rose-500/10 text-rose-400 border border-rose-500/10">${job.salaryType}</span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 text-[10px] text-gray-400 bg-black/20 p-2 rounded-xl">
                            <span><i class="fa-solid fa-location-dot text-rose-500 ml-1"></i> ${job.location}</span>
                            <span><i class="fa-solid fa-wallet text-orange-500 ml-1"></i> ${job.salaryValue}</span>
                        </div>

                        <p class="text-[11px] text-gray-300 leading-relaxed whitespace-pre-line bg-black/10 p-2.5 rounded-xl border border-white/5">${job.description}</p>

                        <div class="flex gap-2 pt-1">
                            ${isMyOwnJob ? 
                                `<button onclick="closeJob('${jobId}')" class="w-full py-2 bg-black hover:bg-red-950/20 text-red-500 rounded-xl text-xs font-bold border border-red-500/20 transition-all"><i class="fa-solid fa-ban ml-1"></i> إغلاق التوظيف وسحب الإعلان</button>` : 
                                `
                                <a href="https://wa.me/2${cleanPhone}" target="_blank" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition-all text-center flex items-center justify-center gap-1">
                                    <i class="fa-brands fa-whatsapp text-sm"></i> تواصل عبر واتساب
                                </a>
                                `
                            }
                        </div>
                    `;
                    jobsList.appendChild(card);
                });
            }, err => {
                console.error(err);
                document.getElementById('jobs-list').innerHTML = `<div class="text-center text-red-500 text-xs py-5">حدث خطأ في تحميل البيانات: ${err.message}</div>`;
            });
        }

        // 2️⃣ دالة رفع وظيفة جديدة
        window.publishJob = function() {
            const title = document.getElementById('job-title').value.trim();
            const location = document.getElementById('job-location').value.trim();
            const phone = document.getElementById('job-phone').value.trim();
            const salaryType = document.getElementById('job-salary-type').value;
            const salaryValue = document.getElementById('job-salary-value').value.trim();
            const description = document.getElementById('job-desc').value.trim();

            if (!title || !location || !phone || !salaryValue || !description) {
                alert("برجاء ملء جميع خانات تفاصيل الوظيفة بما فيها رقم التواصل!");
                return;
            }

            const publishBtn = document.querySelector("button[onclick='publishJob()']");
            if(publishBtn) publishBtn.innerText = "جاري النشر...";

            db.collection('users').doc(user.uid).get().then(uDoc => {
                const cName = uDoc.exists ? (uDoc.data().name || "مكتب عقاري") : "بروكر عقاري";
                
                const jobData = {
                    companyId: user.uid,
                    companyName: cName,
                    title: title,
                    location: location,
                    phone: phone, // حفظ رقم تواصل البروكر
                    salaryType: salaryType,
                    salaryValue: salaryValue,
                    description: description,
                    status: 'active',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                db.collection('sales_jobs').add(jobData).then(() => {
                    alert("🎉 تم نشر الوظيفة بنجاح في لوحة السيلز!");
                    closeAddJobModal();
                    
                    if(publishBtn) publishBtn.innerText = "نشر الوظيفة فوراً";
                    document.getElementById('job-title').value = '';
                    document.getElementById('job-location').value = '';
                    document.getElementById('job-phone').value = '';
                    document.getElementById('job-salary-value').value = '';
                    document.getElementById('job-desc').value = '';
                }).catch(e => {
                    if(publishBtn) publishBtn.innerText = "نشر الوظيفة فوراً";
                    alert("فشل النشر بسبب قواعد الحماية: " + e.message);
                });
            }).catch(err => {
                if(publishBtn) publishBtn.innerText = "نشر الوظيفة فوراً";
                alert("خطأ في قراءة بيانات المستخدم: " + err.message);
            });
        }

        // إغلاق وظيفة
        window.closeJob = function(jobId) {
            if (confirm("هل أنت متأكد من إغلاق التوظيف لهذه الوظيفة؟")) {
                db.collection('sales_jobs').doc(jobId).update({ status: 'closed' });
            }
        }

        // 3️⃣ جلب طلبات التوظيف الواردة
        function listenToIncomingApplications(myUid, firestoreDb) {
            firestoreDb.collection('job_applications').where('employerId', '==', myUid).onSnapshot(snap => {
                const appsList = document.getElementById('apps-list');
                const badge = document.getElementById('app-badge');
                appsList.innerHTML = '';

                if (snap.empty) {
                    badge.classList.add('hidden');
                    appsList.innerHTML = `<div class="text-center py-12 text-gray-500 text-xs font-bold">📨 لم تصلك أي طلبات تقديم من السيلز حتى الآن.</div>`;
                    return;
                }

                badge.classList.remove('hidden');
                badge.innerText = snap.size;

                const sortedApps = snap.docs.sort((a, b) => {
                    const timeA = a.data().createdAt ? a.data().createdAt.toMillis() : 0;
                    const timeB = b.data().createdAt ? b.data().createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                sortedApps.forEach(doc => {
                    const app = doc.data();
                    const card = document.createElement('div');
                    card.className = "bg-[#18181c] p-4 rounded-2xl border border-white/5 space-y-2 relative shadow-md";
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="text-xs font-bold text-white"><i class="fa-solid fa-user-tie text-rose-500 ml-1"></i> ${app.applicantName}</h4>
                                <p class="text-[9px] text-gray-400 mt-1">متقدم لوظيفة: <span class="text-orange-400 font-bold">${app.jobTitle}</span></p>
                            </div>
                            <span class="text-[9px] text-gray-500">${app.createdAt ? new Date(app.createdAt.seconds*1000).toLocaleDateString('ar-EG') : 'الآن'}</span>
                        </div>
                        <div class="bg-black/30 p-2 rounded-xl text-[10px] text-gray-300 flex items-center justify-between">
                            <span>📞 رقم التليفون: <span class="text-white font-mono select-all">${app.applicantPhone}</span></span>
                            <button onclick="loadPage('chat')" class="px-2.5 py-1 bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white rounded-lg transition-all font-bold text-[9px]">فتح شات لايف</button>
                        </div>
                    `;
                    appsList.appendChild(card);
                });
            });
        }

    })();
</script>

            border-radius: 1rem; 
            color: #ffffff; 
        }
        .glass-input:focus { 
            border-color: #ef4444;

        .tab-btn.active {

        .tab-btn.active::after {

        function initTomSelect() {
            const govOptions = Object.keys(locations).map(g => ({value: g, text: g}));

        async function uploadDocumentToSupabase(file, prefix) {
            if(!file) return null;
            const fileName = `verification/${prefix}_${Date.now()}_${Math.random().toString(36).substring(7)}.png`;
            const uploadUrl = `${SUPABASE_URL}/storage/v1/object/${BUCKET_NAME}/${fileName}`;
            const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${fileName}`;

            try {
                const response = await fetch(uploadUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': file.type,
                        'x-upsert': 'true'
                    },
                    body: file
                });

                if (response.ok) return publicUrl;
                return null;
            } catch (err) {
                console.error("Supabase upload error:", err);
                return null;
            }
        }

            if (!email || !pass) return alert("يرجى إدخال البريد الإلكتروني وكلمة المرور");
            
            if (mode === 'register') {
                if (pass !== confirmPass) return alert("كلمات المرور غير متطابقة");
                if (!document.getElementById('terms-check').checked) return alert("يجب الموافقة على شروط الاستخدام للمتابعة");
            }

            overlay.style.display = 'flex';

            try {
                if (mode === 'login') {
                    await auth.signInWithEmailAndPassword(email, pass);
                    window.location.replace('index.html');
                } else {
                    if (!fullName) throw new Error("الاسم الكامل مطلوب");
                    const userCred = await auth.createUserWithEmailAndPassword(email, pass);
                    const uid = userCred.user.uid;

                    if (role === 'broker' || role === 'owner') {
                        const rawPhone = document.getElementById('phone').value.trim();
                        const countryCode = document.getElementById('country-code').value;
                        const phone = countryCode + rawPhone;

                        if (!rawPhone) throw new Error("رقم الهاتف مطلوب");

                        const fFront = document.getElementById('id-front').files[0];
                        const fBack = document.getElementById('id-back').files[0];
                        if (!fFront || !fBack) throw new Error("يجب إرفاق وجه وظهر البطاقة الشخصية");

                        document.getElementById('loading-text').innerText = "جاري رفع وتأمين المستندات...";
                        
                        const url1 = await uploadDocumentToSupabase(fFront, `${role}_front`);
                        const url2 = await uploadDocumentToSupabase(fBack, `${role}_back`);

                        if (!url1 || !url2) throw new Error("فشل رفع المستندات، تحقق من الاتصال");

                        document.getElementById('loading-text').innerText = "جاري حفظ وتوثيق بيانات الحساب...";

                        let userData = {
                            userId: uid,
                            name: fullName,
                            email: email,
                            phone: phone,
                            role: role, 
                            status: 'pending',
                            isBanned: false,
                            nationalIdFrontImg: url1,
                            nationalIdBackImg: url2,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };

                        if (role === 'broker') {
                            const companyName = document.getElementById('company-name').value.trim();
                            const gov = govSelectInstance ? govSelectInstance.getValue() : '';
                            const city = citySelectInstance ? citySelectInstance.getValue() : '';
                            const street = document.getElementById('street').value.trim();
                            if (!gov || !city) throw new Error("المحافظة والمدينة إجباري للوسطاء");
                            
                            userData.companyName = companyName || "مكتب فردي";
                            userData.address = `${gov} - ${city} - ${street}`;
                        } else if (role === 'owner') {
                            userData.companyName = "مالك عقار خاص";
                            userData.address = "غير محدد";
                        }

                        await db.collection("users").doc(uid).set(userData);

                        overlay.style.display = 'none';
                        document.body.innerHTML = `
                            <div class="min-h-screen flex items-center justify-center p-4">
                                <div class="max-w-md w-full glass-panel p-8 rounded-[36px] text-center border border-red-500/20">
                                    <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-5 border border-red-500/20">
                                        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                                    </div>
                                    <h2 class="text-lg font-900 text-white mb-2">تم إنشاء حسابك وتوثيقه بنجاح</h2>
                                    <p class="text-gray-400 text-xs leading-relaxed mb-6">تم رفع المستندات إلى السيرفر الآمن، وبياناتك الآن قيد المراجعة الفورية من الإدارة.</p>
                                    <button onclick="location.href='index.html'" class="w-full py-3.5 rounded-xl btn-red text-white font-bold text-xs uppercase tracking-wider">الانتقال للرئيسية</button>
                                </div>
                            </div>`;
                    } else {
                        await db.collection("users").doc(uid).set({
                            userId: uid,
                            name: fullName,
                            email: email,
                            role: 'buyer',
                            status: 'active',
                            isBanned: false,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        window.location.replace('index.html');
                    }
                }
            } catch (e) {
                alert("خطأ: " + e.message);
                overlay.style.display = 'none';
            }
        }
    </script>
</body>
</html>

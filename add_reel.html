<div class="max-w-md mx-auto p-5 pb-28 text-right font-sans antialiased text-white dir-rtl relative" dir="rtl">

    <!-- نظام التنبيهات المخصص (Custom Toast Container) -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[200] w-11/12 max-w-sm flex flex-col gap-2 pointer-events-none"></div>

    <!-- الهيدر العلوي -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-xl font-black text-white tracking-wide">نشر ريلز جديد 🎬</h1>
            <p class="text-[11px] font-bold text-zinc-400 mt-0.5">شارك عقاراتك بالفيديو مع آلاف المشتريين</p>
        </div>
        <button onclick="if(typeof loadPage === 'function'){ loadPage('profile'); } else { window.location.href='profile.html'; }" 
                class="w-9 h-9 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center transition-all active:scale-95 shadow-md">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>
    </div>

    <!-- كارد حالة الاشتراك وحصة الفيديوهات -->
    <div id="subscription-status-card" class="mb-6 p-4 rounded-3xl bg-zinc-900/90 border border-zinc-800 relative overflow-hidden shadow-2xl backdrop-blur-md">
        <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
                <span id="sub-status-dot" class="w-2.5 h-2.5 rounded-full bg-zinc-600"></span>
                <span id="sub-plan-name" class="text-xs font-black text-zinc-200">جاري فحص الاشتراك...</span>
            </div>
            <span id="sub-usage-text" class="text-[11px] font-bold text-zinc-400">-- / -- فيديو</span>
        </div>
        
        <!-- شريط تقدم حصة الاستخدام -->
        <div class="w-full h-2 bg-zinc-800/80 rounded-full overflow-hidden p-0.5 border border-zinc-700/30">
            <div id="sub-progress-bar" class="h-full bg-gradient-to-r from-red-600 to-amber-500 rounded-full transition-all duration-500 w-0"></div>
        </div>
        
        <div id="sub-warning-msg" class="hidden mt-3 pt-3 border-t border-zinc-800/80 flex items-center justify-between">
            <span class="text-[11px] font-bold text-amber-400 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-exclamation text-xs"></i>
                <span id="warning-text-val">لا توجد باقة نشطة</span>
            </span>
            <a href="deposit.html" class="text-[10px] font-black bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white px-3.5 py-1.5 rounded-xl transition-all shadow-lg shadow-red-600/25 active:scale-95">
                ترقية الباقة 🚀
            </a>
        </div>
    </div>

    <!-- منطقة اختيار ورفع الفيديو -->
    <div class="relative group">
        <div class="upload-zone border-2 border-dashed border-zinc-800 hover:border-red-500/50 rounded-3xl transition-all duration-300 bg-zinc-900/40 flex flex-col items-center justify-center cursor-pointer overflow-hidden relative shadow-2xl backdrop-blur-sm" 
             id="drop-zone" 
             onclick="document.getElementById('vidIn').click()" 
             style="width: 100%; height: 310px;">
            
            <div id="preview-box" class="hidden w-full h-full absolute inset-0 bg-black">
                <video id="video-preview" class="w-full h-full object-cover" playsinline muted loop></video>
                <button onclick="event.stopPropagation(); window.removeSelectedVideo();" 
                        class="absolute top-3 left-3 bg-black/70 hover:bg-red-600 text-white p-2.5 rounded-2xl backdrop-blur-md transition-all active:scale-95 border border-white/10 z-20 shadow-lg">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
            </div>

            <div id="placeholder-box" class="flex flex-col items-center text-center p-6 space-y-3">
                <div class="w-16 h-16 bg-gradient-to-tr from-red-600/20 to-red-500/5 border border-red-500/20 rounded-2xl flex items-center justify-center shadow-lg shadow-red-600/10 group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl text-red-500"></i>
                </div>
                <div>
                    <h3 class="text-xs font-black text-zinc-200 mb-1">اختر فيديو الريلز من ملفاتك</h3>
                    <p class="text-[10px] font-bold text-zinc-500">يدعم MP4, MOV بحجم يصل إلى 60MB</p>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="vidIn" accept="video/*" class="hidden" onchange="window.handleVideo(this.files)">

    <!-- مدخلات الفيديو -->
    <div class="space-y-4 mt-5">
        <div>
            <label class="block text-[11px] font-extrabold text-zinc-400 mb-2 mr-1">عنوان الريلز / الوصف</label>
            <input type="text" id="vTitle" placeholder="مثال: شقة للبيع بالتقسيط المريح 🔥" 
                   class="w-full bg-zinc-900/90 border border-zinc-800 focus:border-red-500/50 rounded-2xl p-4 text-xs font-bold text-white outline-none transition-all placeholder:text-zinc-600 focus:bg-zinc-900 shadow-inner">
        </div>
    </div>

    <!-- مؤشر حالة العملية -->
    <div id="status-info" class="text-center mt-5 text-[11px] font-bold text-zinc-400 flex items-center justify-center gap-2">
        <span>في انتظار اختيار الفيديو...</span>
    </div>

    <!-- زر النشر الرئيسي -->
    <button id="publish-btn" onclick="window.executeUploadSequence()" disabled 
            class="w-full bg-zinc-800 text-zinc-500 py-4 rounded-2xl font-black text-xs mt-6 transition-all shadow-xl flex items-center justify-center gap-2 cursor-not-allowed">
        <i class="fa-solid fa-paper-plane text-xs"></i>
        <span>نشر الريلز الآن</span>
    </button>
</div>

<script>
    window.selectedVideoFile = null;
    window.userCanPublish = false;
    window.userReelsCount = 0;
    window.planReelsLimit = 0;

    // دالة التنبيهات الاحترافية المصممة المخصصة
    window.showToast = function(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;

        const toast = document.createElement('div');
        
        let bgStyle = 'bg-zinc-900/95 border-zinc-800 text-zinc-200';
        let icon = '<i class="fa-solid fa-circle-info text-blue-400"></i>';

        if (type === 'success') {
            bgStyle = 'bg-zinc-900/95 border-emerald-500/40 text-emerald-400';
            icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
        } else if (type === 'error') {
            bgStyle = 'bg-zinc-900/95 border-red-500/40 text-red-400';
            icon = '<i class="fa-solid fa-circle-xmark text-red-500"></i>';
        } else if (type === 'warning') {
            bgStyle = 'bg-zinc-900/95 border-amber-500/40 text-amber-400';
            icon = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>';
        }

        toast.className = `pointer-events-auto p-3.5 rounded-2xl border ${bgStyle} shadow-2xl backdrop-blur-xl flex items-center gap-3 text-xs font-black transition-all duration-300 opacity-0 transform -translate-y-2`;
        toast.innerHTML = `${icon}<span class="flex-1 leading-snug">${message}</span>`;

        container.appendChild(toast);

        requestAnimationFrame(() => {
            toast.classList.remove('opacity-0', '-translate-y-2');
        });

        setTimeout(() => {
            toast.classList.add('opacity-0', '-translate-y-2');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    };

    // دالة الحماية من XSS
    function escapeHTML(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // فحص اشتراك المستخدم وحصة الفيديوهات مع آليات الأمان ومنع TypeError
    window.checkUserSubscription = async function() {
        const statusCardTitle = document.getElementById('sub-plan-name');
        const usageText = document.getElementById('sub-usage-text');
        const progressBar = document.getElementById('sub-progress-bar');
        const warningBox = document.getElementById('sub-warning-msg');
        const warningText = document.getElementById('warning-text-val');
        const statusDot = document.getElementById('sub-status-dot');

        if (typeof auth === 'undefined' || !auth.currentUser) {
            if (statusCardTitle) statusCardTitle.innerText = "يرجى تسجيل الدخول أولاً";
            return;
        }

        try {
            const user = auth.currentUser;
            const userDoc = await db.collection('users').doc(user.uid).get();

            if (!userDoc.exists) {
                window.setUserNoPlanState("بيانات المستخدم غير مسجلة");
                return;
            }

            const userData = userDoc.data();
            const planId = userData.activePlanId;

            // التحقق الجذري لمنع TypeError: التأكد من أن planId نصي وليس true أو null
            if (!planId || typeof planId !== 'string' || planId.trim() === '') {
                window.setUserNoPlanState("غير مشترك في باقة نشطة");
                return;
            }

            window.userReelsCount = Number(userData.reelsCount || 0);

            // جلب بيانات الباقة من الفايربيز
            const planDoc = await db.collection('packages').doc(planId).get();
            if (!planDoc.exists) {
                window.setUserNoPlanState("الباقة المحددة غير صالحة");
                return;
            }

            const planData = planDoc.data();
            window.planReelsLimit = Number(planData.reelsLimit || 0);

            // تحديث واجهة الكارد
            if (statusCardTitle) statusCardTitle.innerText = `الباقة: ${escapeHTML(planData.name || 'باقة مميزة')}`;
            if (usageText) usageText.innerText = `${window.userReelsCount} / ${window.planReelsLimit} فيديو`;

            const percentage = Math.min(100, Math.round((window.userReelsCount / Math.max(1, window.planReelsLimit)) * 100));
            if (progressBar) progressBar.style.width = `${percentage}%`;

            if (window.userReelsCount >= window.planReelsLimit) {
                window.userCanPublish = false;
                if (statusDot) statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";
                if (warningBox) warningBox.classList.remove('hidden');
                if (warningText) warningText.innerText = "استنفذت حصة الفيديوهات للباقة الحالية!";
            } else {
                window.userCanPublish = true;
                if (statusDot) statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                if (warningBox) warningBox.classList.add('hidden');
            }

            window.updatePublishButtonState();

        } catch (err) {
            console.error("خطأ آمن أثناء جلب الاشتراك:", err);
            window.setUserNoPlanState("تعذر التحقق من الباقة الحالية");
        }
    };

    // وضع الحساب الخالي من الباقات
    window.setUserNoPlanState = function(msg) {
        window.userCanPublish = false;
        const statusCardTitle = document.getElementById('sub-plan-name');
        const usageText = document.getElementById('sub-usage-text');
        const warningBox = document.getElementById('sub-warning-msg');
        const warningText = document.getElementById('warning-text-val');
        const statusDot = document.getElementById('sub-status-dot');

        if (statusCardTitle) statusCardTitle.innerText = msg;
        if (usageText) usageText.innerText = "0 / 0 فيديو";
        if (statusDot) statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
        if (warningBox) warningBox.classList.remove('hidden');
        if (warningText) warningText.innerText = msg;

        window.updatePublishButtonState();
    };

    // تحديث حالة زر النشر
    window.updatePublishButtonState = function() {
        const btn = document.getElementById('publish-btn');
        if (!btn) return;

        if (window.selectedVideoFile && window.userCanPublish) {
            btn.disabled = false;
            btn.className = "w-full bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white py-4 rounded-2xl font-black text-xs mt-6 transition-all active:scale-95 shadow-lg shadow-red-600/25 flex items-center justify-center gap-2 cursor-pointer";
        } else {
            btn.disabled = true;
            btn.className = "w-full bg-zinc-800/80 text-zinc-500 py-4 rounded-2xl font-black text-xs mt-6 transition-all shadow-xl flex items-center justify-center gap-2 cursor-not-allowed";
        }
    };

    // التعامل مع اختيار الفيديو
    window.handleVideo = function(files) {
        if (files && files[0]) {
            const file = files[0];
            
            if (file.size > 60 * 1024 * 1024) {
                window.showToast("حجم الفيديو يتجاوز 60 ميجابايت!", "error");
                return;
            }

            window.selectedVideoFile = file;
            const placeholder = document.getElementById('placeholder-box');
            const previewBox = document.getElementById('preview-box');
            const videoEl = document.getElementById('video-preview');

            if (placeholder && previewBox && videoEl) {
                placeholder.classList.add('hidden');
                previewBox.classList.remove('hidden');
                
                const fileURL = URL.createObjectURL(file);
                videoEl.src = fileURL;
                videoEl.load();
                videoEl.play().catch(e => console.log("Auto-play preview:", e));
                
                document.getElementById('status-info').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i><span class="text-zinc-200">تم تحميل الفيديو بنجاح</span>`;
            }

            window.updatePublishButtonState();
        }
    };

    // مسح الفيديو المختار
    window.removeSelectedVideo = function() {
        window.selectedVideoFile = null;
        document.getElementById('vidIn').value = "";
        
        const placeholder = document.getElementById('placeholder-box');
        const previewBox = document.getElementById('preview-box');
        const videoEl = document.getElementById('video-preview');

        if (videoEl) videoEl.src = "";
        if (previewBox) previewBox.classList.add('hidden');
        if (placeholder) placeholder.classList.remove('hidden');

        document.getElementById('status-info').innerHTML = `<span>في انتظار اختيار الفيديو...</span>`;
        window.updatePublishButtonState();
    };

    // تنفيذ الرفع والنشر المكتمل
    window.executeUploadSequence = async function() {
        if (!window.selectedVideoFile) {
            window.showToast("يرجى اختيار فيديو أولاً!", "warning");
            return;
        }

        if (!window.userCanPublish) {
            window.showToast("لا توجد باقة نشطة أو استنفذت حصتك!", "error");
            return;
        }

        const btn = document.getElementById('publish-btn');
        const statusInfo = document.getElementById('status-info');

        if (btn) {
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>جاري رفع ونشر الفيديو...</span>`;
        }

        try {
            const user = auth.currentUser;
            if (!user) throw new Error("يرجى تسجيل الدخول أولاً");

            if (statusInfo) statusInfo.innerText = "جاري رفع ملف الفيديو إلى السيرفر...";

            const fileExt = window.selectedVideoFile.name.split('.').pop() || 'mp4';
            const fileName = `reel_${Date.now()}_${Math.floor(Math.random()*1000)}.${fileExt}`;
            
            // تم التحديث هنا بالرابط والمفتاح الجديد الخاص بك
            const supabaseUrl = 'https://lviwhlekdekvyevknopr.supabase.co';
            const supabaseKey = 'sb_publishable_l5yoWx8KXsLobZqrW33Fqg_Lq9jz8EC';

            const customSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            // 1. الرفع لسوبابيز (مع حل مشكلة الـ contentType)
            const { data, error: uploadError } = await customSupabase.storage
                .from('aqaro-media')
                .upload(fileName, window.selectedVideoFile, {
                    cacheControl: '3600',
                    upsert: false,
                    contentType: window.selectedVideoFile.type || 'video/mp4'
                });

            if (uploadError) {
                console.error("تفاصيل خطأ سوبابيز:", uploadError);
                throw new Error(uploadError.message || "فشل رفع الملف إلى سوبابيز");
            }

            // 2. استخراج الرابط المباشر
            const { data: urlData } = customSupabase.storage
                .from('aqaro-media')
                .getPublicUrl(fileName);

            if (!urlData || !urlData.publicUrl) throw new Error("تعذر استخراج رابط الفيديو");

            const finalVideoLink = urlData.publicUrl;

            if (statusInfo) statusInfo.innerText = "جاري الحفظ وتحديث حصتك...";

            // 3. كتابة البيانات وزيادة عداد الـ reelsCount
            const batch = db.batch();
            const videoRef = db.collection('videos').doc();
            
            const rawTitle = document.getElementById('vTitle').value || 'بدون عنوان';
            const safeUserName = user.displayName ? user.displayName : (user.email ? user.email.split('@')[0] : "مستخدم");
            
            batch.set(videoRef, {
                title: rawTitle,
                videoUrl: finalVideoLink,
                userId: user.uid,
                userName: safeUserName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                commentsCount: 0,
                likes: {}
            });
            
            batch.set(db.collection('users').doc(user.uid), {
                reelsCount: firebase.firestore.FieldValue.increment(1)
            }, { merge: true });

            await batch.commit();
            
            window.showToast("تم نشر الريلز بنجاح! 🚀", "success");

            setTimeout(() => {
                if (typeof loadPage === 'function') {
                    loadPage('profile');
                } else {
                    window.location.href = 'profile.html';
                }
            }, 1200);

        } catch (error) {
            console.error("تفاصيل الخطأ الكلي:", error);
            
            let errMsg = "حدث خطأ غير متوقع";
            if (error && error.message) {
                errMsg = error.message;
            } else if (typeof error === 'object') {
                try { errMsg = JSON.stringify(error); } catch(e) {}
            }
            
            window.showToast("خطأ أثناء النشر: " + errMsg, "error");
            window.updatePublishButtonState();
            if (statusInfo) statusInfo.innerText = "فشلت العملية، حاول مرة أخرى.";
        }
    };

    // تشغيل الفحص عند التأكد من وجود جلسة المستخدم
    if (typeof auth !== 'undefined') {
        auth.onAuthStateChanged(user => {
            if (user) {
                window.checkUserSubscription();
            }
        });
    }
</script>

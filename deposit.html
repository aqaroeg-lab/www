<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqaro | مركز شحن الرصيد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen p-4 pb-24 font-[Cairo]">

<div class="max-w-md mx-auto space-y-6">
    <!-- الهيدر -->
    <div class="flex items-center gap-4 border-b border-white/5 pb-4">
        <button onclick="history.back()" class="bg-zinc-800/80 p-3 rounded-2xl active:scale-95 transition-all text-sm"><i class="fa-solid fa-arrow-right"></i></button>
        <div>
            <h2 class="text-xl font-black text-white">شحن رصيد المحفظة</h2>
            <p class="text-[10px] text-gray-400 mt-0.5">اختر وسيلة الدفع وحول المبلغ ثم ارفع صورة الإيصال</p>
        </div>
    </div>
    
    <!-- طرق الدفع المتاحة -->
    <div>
        <h3 class="font-black text-xs text-red-500 uppercase tracking-widest mb-3 flex items-center gap-2">
            <i class="fa-solid fa-wallet"></i> طرق الدفع المتاحة للتحويل
        </h3>
        <div id="deposit-methods" class="space-y-3">
            <div class="text-center text-gray-500 py-4 text-xs">جاري تحميل طرق الدفع...</div>
        </div>
    </div>

    <!-- نموذج إرسال الإيداع -->
    <div class="glass p-6 rounded-3xl space-y-4 shadow-2xl">
        <h3 class="font-black text-xs text-white flex items-center gap-2">
            <i class="fa-solid fa-file-invoice-dollar text-red-500"></i> بيانات عملية التحويل
        </h3>
        
        <div>
            <label class="block mb-1.5 text-[11px] text-gray-400 font-bold">المبلغ المحول بالفعل (ج.م)</label>
            <input type="number" id="dep-amount" placeholder="مثال: 500" class="w-full bg-black p-4 rounded-2xl text-sm border border-white/10 outline-none focus:border-red-500 font-black text-white">
        </div>

        <div>
            <label class="block mb-1.5 text-[11px] text-gray-400 font-bold">صورة إيصال التحويل (سكرين شوت)</label>
            <label class="flex flex-col items-center justify-center border-2 border-dashed border-white/10 hover:border-red-500/50 rounded-2xl p-6 cursor-pointer bg-black/40 transition-all">
                <i class="fa-solid fa-cloud-arrow-up text-2xl text-red-500 mb-2"></i>
                <span id="file-name" class="text-xs text-gray-300 font-bold">اضغط لاختيار صورة الإيصال</span>
                <span class="text-[9px] text-gray-500 mt-1">PNG, JPG</span>
                <input type="file" id="receipt-file" accept="image/*" class="hidden" onchange="updateFileName(this)">
            </label>
        </div>

        <button id="deposit-btn" onclick="submitDeposit()" class="w-full bg-gradient-to-r from-red-600 to-rose-700 py-4 rounded-2xl text-xs font-black shadow-lg shadow-red-900/30 active:scale-95 transition-all">
            إرسال طلب الإيداع للمراجعة
        </button>
    </div>

    <!-- سجل طلبات المستخدم -->
    <div>
        <h3 class="font-black text-xs text-gray-400 uppercase tracking-widest mb-3">سجل طلبات الشحن السابقة</h3>
        <div id="requests-history" class="space-y-3">
            <div class="text-center text-gray-600 py-4 text-xs">لا توجد طلبات سابقة</div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBbLytLmCWW-cy3SY80Yz7HQdaqog5ONKE",
        authDomain: "youssef-4170d.firebaseapp.com",
        projectId: "youssef-4170d",
        storageBucket: "youssef-4170d.appspot.com",
        appId: "1:333881327588:android:e52a39b64cccd975f551f1"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    const SUPABASE_URL = 'https://lviwhlekdekvyevknopr.supabase.co';
    const SUPABASE_KEY='sb_publishable_l5yoWx8KXsLobZqrW33Fqg_Lq9jz8EC';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function updateFileName(input) {
        if (input.files && input.files[0]) {
            document.getElementById('file-name').innerText = input.files[0].name;
            document.getElementById('file-name').classList.add('text-red-500');
        }
    }

    // جلب طرق الدفع
    db.collection("payment_methods").onSnapshot(s => {
        const cont = document.getElementById('deposit-methods');
        cont.innerHTML = "";
        
        if(s.empty) {
            cont.innerHTML = `<div class="glass p-4 rounded-2xl text-center text-gray-500 text-xs">لا توجد وسائل دفع مضافة حالياً من الإدارة</div>`;
            return;
        }

        s.forEach(doc => {
            const m = doc.data();
            cont.innerHTML += `
            <div class="glass p-4 rounded-2xl flex justify-between items-center border border-white/5 shadow-md">
                <div>
                    <p class="font-black text-xs text-white">${m.name}</p>
                    <p class="text-red-500 text-sm font-mono font-black mt-0.5" dir="ltr">${m.number}</p>
                </div>
                <button onclick="navigator.clipboard.writeText('${m.number}'); alert('تم نسخ الرقم بنجاح');" class="bg-white/10 hover:bg-white/20 px-4 py-2 text-[10px] font-bold rounded-xl transition-all">
                    <i class="fa-regular fa-copy ml-1"></i> نسخ
                </button>
            </div>`;
        });
    });

    // جلب سجل طلبات الإيداع وتم حل مشكلة Index عبر الترتيب في الكود المباشر
    auth.onAuthStateChanged(user => {
        if(user) {
            db.collection('deposits').where('userId', '==', user.uid).onSnapshot(s => {
                const hist = document.getElementById('requests-history');
                hist.innerHTML = "";
                
                if(s.empty) {
                    hist.innerHTML = `<div class="glass p-4 rounded-2xl text-center text-gray-600 text-xs">لم تقم بأي طلبات إيداع بعد</div>`;
                    return;
                }

                const deposits = [];
                s.forEach(doc => deposits.push({ id: doc.id, ...doc.data() }));

                // ترتيب عناصر السجل من الأحدث للأقدم
                deposits.sort((a, b) => {
                    const dateA = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)) : new Date(0);
                    const dateB = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)) : new Date(0);
                    return dateB - dateA;
                });

                deposits.forEach(d => {
                    let statusText = 'جاري المراجعة';
                    let color = 'text-yellow-500 bg-yellow-500/10 border-yellow-500/25';
                    
                    if(d.status === 'approved') {
                        statusText = 'تم القبول والشحن';
                        color = 'text-green-500 bg-green-500/10 border-green-500/25';
                    } else if(d.status === 'rejected') {
                        statusText = 'مرفوض';
                        color = 'text-red-500 bg-red-500/10 border-red-500/25';
                    }

                    const dateStr = d.createdAt ? (d.createdAt.toDate ? d.createdAt.toDate().toLocaleString('ar-EG') : new Date(d.createdAt).toLocaleString('ar-EG')) : 'جاري الحفظ...';

                    hist.innerHTML += `
                    <div class="glass p-4 rounded-2xl flex justify-between items-center border border-white/5">
                        <div>
                            <p class="text-base font-black text-white">${d.amount} <span class="text-xs font-normal text-gray-400">ج.م</span></p>
                            <p class="text-[9px] text-gray-500 mt-1">${dateStr}</p>
                        </div>
                        <span class="px-3 py-1.5 rounded-xl text-[10px] font-black border ${color}">${statusText}</span>
                    </div>`;
                });
            }, err => {
                console.error("خطأ قراءة سجل الطلبات:", err);
            });
        }
    });

    // رفع الإيصال لـ Supabase والتخزين في Firestore
    async function submitDeposit() {
        const amount = document.getElementById('dep-amount').value.trim();
        const file = document.getElementById('receipt-file').files[0];
        
        if(!amount || Number(amount) <= 0) return alert("يرجى إدخال مبلغ صحيح");
        if(!file) return alert("يرجى اختيار صورة إيصال التحويل");

        const btn = document.getElementById('deposit-btn');
        btn.disabled = true; 
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin ml-2"></i> جاري الرفع وإرسال الطلب...`;
        
        try {
            const fileExt = file.name.split('.').pop();
            const fileName = `${auth.currentUser.uid}_${Date.now()}.${fileExt}`;
            const filePath = `receipts/${fileName}`;

            // الرفع لـ Supabase Storage بداخل الـ Bucket المحدد
            const { data, error } = await sb.storage.from('aqaro-media').upload(filePath, file, {
                cacheControl: '3600',
                upsert: false
            });

            if (error) throw error;
            
            // جلب الرابط العام للصورة
            const { data: urlData } = sb.storage.from('aqaro-media').getPublicUrl(filePath);
            const publicUrl = urlData.publicUrl;

            // حفظ الطلب في Firestore
            await db.collection('deposits').add({
                userId: auth.currentUser.uid,
                userName: auth.currentUser.displayName || "مستخدم تطبيق",
                amount: Number(amount),
                receiptUrl: publicUrl,
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("تم إرسال طلب الإيداع بنجاح وسيتم مراجعته من الإدارة قريباً!");
            document.getElementById('dep-amount').value = "";
            document.getElementById('receipt-file').value = "";
            document.getElementById('file-name').innerText = "اضغط لاختيار صورة الإيصال";
            document.getElementById('file-name').classList.remove('text-red-500');

        } catch(e) { 
            console.error("خطأ الرفع:", e);
            alert("حدث خطأ أثناء رفع الإيصال: " + (e.message || "تأكد من اتصال الإنترنت وحجم الصورة"));
        } finally {
            btn.disabled = false; 
            btn.innerHTML = "إرسال طلب الإيداع للمراجعة";
        }
    }
</script>
</body>
</html>
